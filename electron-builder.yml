appId: ci.gestdepot.desktop
productName: GestDepot
copyright: Copyright © 2026 GestDepot Côte d'Ivoire
directories:
  output: release
  buildResources: electron
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/pwa-512x512.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: GestDepot
  installerLanguages:
    - fr_FR
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: public/pwa-512x512.png
dmg:
  title: GestDepot — Installation
linux:
  target:
    - AppImage
  icon: public/pwa-512x512.png
